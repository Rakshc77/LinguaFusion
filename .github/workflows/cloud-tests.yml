name: Cloud pilot tests
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r cloud_api/requirements.txt 'pytest>=8,<10'
      - run: python -m pytest cloud_api -o python_files=test_*.py -q
      - run: node --test cloud_api/web/*.test.mjs
