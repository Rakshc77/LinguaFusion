name: Android source checks
on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'android/LinguaFusionMobile/**'
      - '.github/workflows/android-tests.yml'
  pull_request:
    paths:
      - 'android/LinguaFusionMobile/**'
      - '.github/workflows/android-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check source and packaging contracts
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest android/LinguaFusionMobile/test_build_contract.py -q -k 'not signing_keystore_is_present'
      - name: Compile native app Java and run JVM tests
        working-directory: android/LinguaFusionMobile
        run: bash gradlew compileSideloadDebugJavaWithJavac testSideloadDebugUnitTest --no-daemon
