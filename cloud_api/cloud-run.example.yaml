# Review template only. Replace placeholders before deployment.
# Does not create resources, enable billing, or change the existing PC tunnel.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: linguafusion-cloud-pilot
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '1'
    spec:
      serviceAccountName: linguafusion-be@linguafusion-f24fe.iam.gserviceaccount.com
      containerConcurrency: 8
      timeoutSeconds: 60
      containers:
        - image: REPLACE_CONTAINER_IMAGE_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          env:
            - name: LF_FIREBASE_PROJECT_ID
              value: linguafusion-f24fe
            - name: LF_CLOUD_ALLOWED_UIDS
              value: 'kLqjJka0cHXTCZX0TQxA2QMlzKi1'
            - name: LF_CLOUD_OWNER_UID
              value: 'kLqjJka0cHXTCZX0TQxA2QMlzKi1'
            - name: LF_CLOUD_POLICY_BACKEND
              value: firestore
            - name: LF_CLOUD_FIRESTORE_DATABASE
              value: '(default)'
            - name: LF_CLOUD_AI_ENABLED
              value: '0'
            - name: LF_CLOUD_TRANSLATION_MODEL
              value: ''
            - name: LF_CLOUD_ORIGINS
              value: ''
            # AI remains OFF. The OpenRouter/Groq/Vision adapters must be wired
            # through the managed ledger before enabling public paid requests.
            # Never copy the local DPAPI files or ADC into the container.
