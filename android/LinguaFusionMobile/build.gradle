// Build for the LinguaFusion Android app.
//
// This replaces a hand-rolled aapt2 -> javac -> d8 script. That script could
// not resolve Maven dependencies or build native code, which the offline work
// needs for ML Kit and whisper.cpp respectively. See OFFLINE_PLAN.md.
//
// The existing src/ and res/ layout is kept rather than moved into
// src/main/..., so this migration changes the build and nothing else.

plugins {
    id 'com.android.application' version '8.13.2'
}

android {
    namespace 'com.linguafusion.mobile'
    compileSdk 36
    // Pinned. Left unset, AGP quietly downloads whatever its default is, so
    // the native build would change under us on an AGP upgrade. r28c is what
    // whisper.cpp is most widely built against.
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.linguafusion.mobile'
        minSdk 26
        targetSdk 36
        // Was 6 / 1.5 under the old script. Android refuses to install over a
        // higher code, so this must only ever go up.
        versionCode 7
        versionName '1.6'

        ndk {
            // 64-bit phones only. ML Kit ships native code for four ABIs: the
            // x86 pair exists for emulators this app is never installed on,
            // and armeabi-v7a is another 11.6 MB for 32-bit devices that could
            // not usefully run a 190 MB speech model anyway.
            //
            // Dropping it is also what keeps the APK downloadable: Cloud Run
            // refuses to serve a response over 32 MiB, and the QR onboarding
            // flow serves this file. With both arm ABIs the APK was 33.3 MiB
            // and every download failed with a 500 from Google's frontend, not
            // from the app -- see the size guard in test_build_contract.py.
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                // Release flags even in a debug build: an unoptimised whisper
                // is slow enough on a phone to look broken.
                arguments '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release'
            }
        }
    }

    signingConfigs {
        // The SAME debug keystore the old script created and signed with.
        // Signing with a different key makes Android refuse to install over an
        // existing copy: everyone would have to uninstall first and lose their
        // local data. The keystore is not in git, so it must not be lost --
        // a test pins the certificate fingerprint it has to produce.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Deliberately debug-signed for now: production signing is still
            // an open decision, and switching keys later breaks upgrades.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path 'native/jni/CMakeLists.txt'
            version '4.1.2'
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
        // Plain JVM tests. The logic worth testing here -- PCM conversion,
        // language codes -- touches no Android API on purpose, so it can be
        // checked on a normal JVM without a device or an emulator.
        test {
            java.srcDirs = ['test']
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            // whisper.cpp ships a real .so; keeping it uncompressed lets
            // Android map it straight from the APK instead of unpacking it.
            useLegacyPackaging = false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    // On-device translation. The models are not bundled: they arrive through
    // Google Play Services and are managed from the app, so the APK stays
    // small and languages can be added and removed without a new build.
    implementation 'com.google.mlkit:translate:17.0.3'
}

/* The publish script and the QR download flow both expect the APK at
   dist/LinguaFusionMobile-debug.apk, where the old script put it. Keep that
   contract rather than making every downstream step learn Gradle's layout. */
tasks.register('stageApk', Copy) {
    dependsOn 'assembleDebug'
    from(layout.buildDirectory.dir('outputs/apk/debug')) {
        include 'LinguaFusionMobile-debug.apk'
    }
    into layout.projectDirectory.dir('dist')
}
